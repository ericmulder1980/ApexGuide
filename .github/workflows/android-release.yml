# Signed, obfuscated pilot APK published as a GitHub pre-release (DST-001-T4).
#
# Manual trigger only (DEC-015): the repository is public, so no push,
# pull_request or pull_request_target triggers. The build job reads the
# signing secrets from the protected environment `release`, so every run
# waits for the owner's approval. Only the publish job, which never sees the
# secrets, gets a token that can write releases.
name: Android release

on:
  workflow_dispatch:
    inputs:
      config:
        description: Build config file passed to --dart-define-from-file
        type: choice
        default: config/prod.json
        options:
          - config/prod.json
          - config/dev.json

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # Public SHA-256 of the app signing certificate (CN=WebMiller, O=WebMiller, C=NL).
  # The build fails if the APK is signed with any other key.
  EXPECTED_CERT_SHA256: 902b8e327827400abb5409ac46345061f84fdbc448ff461a6527addc75f13f91
  EXPECTED_PACKAGE: nl.webmiller.apexguide
# Runners pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from
# 2026-10-19, and Flutter is pinned to 3.38.10 (DEC-012).

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
    env:
      BUILD_CONFIG: ${{ inputs.config }}
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flutter 3.38.10
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.38.10

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::No version found in pubspec.yaml"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=pilot-v${version}-${GITHUB_RUN_NUMBER}"
            echo "apk=apexguide-${version}-${GITHUB_RUN_NUMBER}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SYMBOLS_PASSWORD: ${{ secrets.ANDROID_SYMBOLS_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD ANDROID_SYMBOLS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the release environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/apexguide-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore"
          } > android/key.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$BUILD_CONFIG" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/apexguide-release.jks" android/key.properties

      - name: Verify signature and package
        id: verify
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          signers=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' apksigner.txt)
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)
          if [ "$signers" != "1" ] || [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the app signing key (signers: $signers, certificate: $cert)"
            exit 1
          fi

          package=$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ "$package" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Unexpected package name: $package"
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/$APK_NAME"
          echo "apk_sha256=$(sha256sum "dist/$APK_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk
          path: dist/${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 7

      # Artifacts of a public repository can be downloaded by any GitHub user,
      # and the symbols undo the obfuscation, so they are only uploaded
      # encrypted. Decrypt: see docs/DEVELOPMENT.md.
      - name: Encrypt debug symbols
        env:
          SYMBOLS_PASSWORD: ${{ secrets.ANDROID_SYMBOLS_PASSWORD }}
          SYMBOLS_FILE: debug-symbols-${{ steps.version.outputs.tag }}.tar.gz.enc
        run: |
          tar -czf - -C build symbols \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
                -pass env:SYMBOLS_PASSWORD -out "dist/$SYMBOLS_FILE"
          rm -rf build/symbols

      - name: Upload encrypted debug symbols
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-symbols-${{ steps.version.outputs.tag }}
          path: dist/debug-symbols-${{ steps.version.outputs.tag }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
      BUILD_CONFIG: ${{ inputs.config }}
    steps:
      - name: Download APK
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: apk
          path: dist

      # The file name is derived here, not passed as a job output: it contains
      # the key alias, and GitHub drops job outputs that contain a secret.
      - name: Check APK checksum
        run: |
          apk="apexguide-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          echo "$APK_SHA256  dist/$apk" | sha256sum --check
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Create GitHub pre-release
        run: |
          {
            echo "Pilot build of ApexGuide ${VERSION} (build ${GITHUB_RUN_NUMBER}) for invited testers."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Config | ${BUILD_CONFIG} |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
            echo "| Signing certificate SHA-256 | \`${EXPECTED_CERT_SHA256}\` |"
          } > notes.md
          gh release create "$TAG" "dist/$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ApexGuide ${VERSION} pilot (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --prerelease
